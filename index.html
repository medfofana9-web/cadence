<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<title>Cadence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
<link rel="apple-touch-startup-image" href="icons/icon-512.png">
</head>
<body>
<div id="backdrop" aria-hidden="true"><div class="bd on"></div><div class="bd"></div><div class="bd-grain"></div></div>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><img src="icons/icon.svg" alt=""><span>Cadence</span></div>
    <nav>
      <a data-route="home" href="#/home" class="nav-link"><svg><use href="#i-home"/></svg>Home</a>
      <a data-route="search" href="#/search" class="nav-link"><svg><use href="#i-search"/></svg>Search</a>
      <div class="nav-label">Library</div>
      <a data-route="songs" href="#/songs" class="nav-link"><svg><use href="#i-note"/></svg>Songs</a>
      <a data-route="artists" href="#/artists" class="nav-link"><svg><use href="#i-mic"/></svg>Artists</a>
      <a data-route="albums" href="#/albums" class="nav-link"><svg><use href="#i-album"/></svg>Albums</a>
      <a data-route="liked" href="#/liked" class="nav-link"><svg><use href="#i-heart"/></svg>Liked Songs</a>
      <a data-route="insights" href="#/insights" class="nav-link"><svg><use href="#i-chart"/></svg>Your listening</a>
      <a data-route="review" href="#/review" class="nav-link" id="review-link" hidden><svg><use href="#i-check"/></svg>Check these<span class="badge-n"></span></a>
      <div class="nav-label">Playlists <button class="icon-btn small" data-action="new-playlist" aria-label="New playlist"><svg><use href="#i-plus"/></svg></button></div>
      <div id="sidebar-playlists"></div>
    </nav>
    <div class="sidebar-foot">
      <a data-route="import" href="#/import" class="nav-link"><svg><use href="#i-upload"/></svg>Add music</a>
      <a data-route="settings" href="#/settings" class="nav-link"><svg><use href="#i-gear"/></svg>Settings</a>
    </div>
  </aside>

  <main id="main"><div class="folder-bar" id="folder-bar" hidden><span>Let Cadence look for new songs in your folder</span><button data-action="scan-folder">Allow</button></div><div id="view"></div></main>

  <footer id="player" class="player empty">
    <div class="p-track" data-action="open-now">
      <div class="p-art"><img id="p-art" alt=""></div>
      <div class="p-meta"><div id="p-title" class="ellipsis">Nothing playing</div><div id="p-artist" class="ellipsis muted"></div></div>
      <button class="icon-btn like-btn" id="p-like" data-action="like-current" aria-label="Like"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="p-center">
      <div class="p-controls">
        <button class="icon-btn mode" id="p-shuffle" data-action="shuffle" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" data-action="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="p-play" data-action="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-action="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        <button class="icon-btn mode" id="p-repeat" data-action="repeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="p-progress"><span id="p-cur" class="time">0:00</span><input type="range" id="p-seek" min="0" max="1000" value="0" class="seek" aria-label="Seek"><span id="p-dur" class="time">0:00</span></div>
    </div>
    <div class="p-right">
      <button class="icon-btn" data-action="open-lyrics" aria-label="Lyrics"><svg><use href="#i-quote"/></svg></button>
      <button class="icon-btn" data-action="open-queue" aria-label="Up next"><svg><use href="#i-queue"/></svg></button>
      <div class="vol"><svg id="vol-icon"><use href="#i-vol"/></svg><input type="range" id="p-vol" min="0" max="100" value="100" aria-label="Volume"></div>
    </div>
    <button class="play-btn mini-only" id="p-play-mini" data-action="toggle"><svg><use href="#i-play"/></svg></button>
    <div class="mini-progress"><div id="p-mini-bar"></div></div>
  </footer>

  <nav class="tabbar">
    <a data-route="home" href="#/home"><svg><use href="#i-home"/></svg><span>Home</span></a>
    <a data-route="search" href="#/search"><svg><use href="#i-search"/></svg><span>Search</span></a>
    <a data-route="library" href="#/library"><svg><use href="#i-library"/></svg><span>Library</span></a>
    <a data-route="import" href="#/import"><svg><use href="#i-upload"/></svg><span>Add</span></a>
  </nav>
</div>

<section id="now" class="now" aria-hidden="true">
  <div class="now-bg" id="now-bg"><div class="bgl on"></div><div class="bgl"></div></div>
  <header class="now-head">
    <button class="icon-btn" data-action="close-now" aria-label="Close"><svg><use href="#i-down"/></svg></button>
    <div class="now-from muted" id="now-from"></div>
    <div class="now-head-r"><button class="icon-btn" id="lyrics-expand" data-action="lyrics-full" aria-label="Full-screen lyrics"><svg><use href="#i-expand"/></svg></button><button class="icon-btn" data-action="track-menu-current" aria-label="More"><svg><use href="#i-more"/></svg></button></div>
  </header>
  <div class="now-body">
    <div class="now-left">
      <div class="now-art"><img id="now-art" alt=""></div>
      <div class="now-meta">
        <div><h2 id="now-title" class="ellipsis"></h2><a id="now-artist" class="ellipsis" href="#/home"></a></div>
        <button class="icon-btn like-btn big" id="now-like" data-action="like-current"><svg><use href="#i-heart"/></svg></button>
      </div>
      <div class="now-progress">
        <input type="range" id="now-seek" min="0" max="1000" value="0" class="seek" aria-label="Seek">
        <div class="now-times"><span id="now-cur">0:00</span><span id="now-dur">0:00</span></div>
      </div>
      <div class="now-controls">
        <button class="icon-btn mode" id="now-shuffle" data-action="shuffle"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn big" data-action="prev"><svg><use href="#i-prev"/></svg></button>
        <button class="play-btn huge" id="now-play" data-action="toggle"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn big" data-action="next"><svg><use href="#i-next"/></svg></button>
        <button class="icon-btn mode" id="now-repeat" data-action="repeat"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="now-tools">
        <button class="pill-btn" data-action="tab-lyrics" id="tab-lyrics"><svg><use href="#i-quote"/></svg>Lyrics</button>
        <button class="pill-btn" data-action="tab-queue" id="tab-queue"><svg><use href="#i-queue"/></svg>Up next</button>
        <button class="pill-btn" data-action="speed" id="speed-btn">1×</button>
        <button class="pill-btn" data-action="sleep" id="sleep-btn"><svg><use href="#i-moon"/></svg><span>Sleep</span></button>
      </div>
    </div>
    <div class="now-right"><div id="now-panel" class="now-panel"></div><button class="pill-btn lyrics-return" id="lyrics-return" data-action="lyrics-return" hidden>Back to current line</button></div>
  </div>
</section>

<div id="sheet-root"></div>
<div id="toast" class="toast"></div>
<div id="update-bar" class="update-bar"><span>A new version of Cadence is ready.</span><button data-action="apply-update">Update</button></div>
<input type="file" id="file-input" multiple accept="audio/*,.mp3,.m4a,.flac,.wav,.aac,.ogg,.opus" hidden>
<input type="file" id="folder-input" webkitdirectory directory multiple hidden>
<input type="file" id="art-input" accept="image/*" hidden>
<input type="file" id="pl-file-input" multiple accept=".txt,.xml,.m3u,.m3u8,text/plain,text/xml,audio/x-mpegurl" hidden>
<audio id="audio" preload="auto" playsinline></audio>
<audio id="audio-b" preload="auto" playsinline></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18.5a3 3 0 1 1-2-2.83V5.2l12-2.4v12.7a3 3 0 1 1-2-2.83V7.4l-8 1.6z"/></symbol>

<script type="module" src="app.js"></script>
</body>
</html>
