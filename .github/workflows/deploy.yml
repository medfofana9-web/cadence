name: Publish Cadence

# Every push to main publishes the app. Open copies of the app notice the new version and offer to update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          echo "{\"version\":\"${GITHUB_SHA}\"}" > version.json
          # every file name carries the version, so an update replaces all of them at once (no half-old screens)
          V="${GITHUB_SHA:0:8}"
          sed -i "s#href=\"styles.css\"#href=\"styles.css?v=$V\"#; s#src=\"app.js\"#src=\"app.js?v=$V\"#" index.html
          for f in app.js config.js lib/*.js; do sed -i -E "s#(from '[^']+\.js)'#\1?v=$V'#g; s#(import\('[^']+\.js)'\)#\1?v=$V')#g" "$f"; done
          grep -c "?v=$V" index.html app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
