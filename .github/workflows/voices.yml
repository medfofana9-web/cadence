name: Audiobook voice samples
on:
  push:
    branches: [audiobook-voices]
    paths: ['tools/audiobook/samples.py', '.github/workflows/voices.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts kokoro soundfile
      - run: python tools/audiobook/samples.py samples
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: samples }
      - name: Save samples to the voice-samples branch
        run: |
          git config user.name fof-bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan voice-samples-out; git rm -rfq .; cp samples/*.mp3 .; git add *.mp3
          git commit -qm "Voice samples"; git push -f origin voice-samples-out
